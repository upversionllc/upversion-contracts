<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPVERSION LLC — Contract Intelligence</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=IBM+Plex+Sans:wght@400;600;700&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #020c18; font-family: 'IBM Plex Sans', sans-serif; color: #ddeeff; }
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: #060f1c; }
::-webkit-scrollbar-thumb { background: #1a3a58; border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%,100%{opacity:1;}50%{opacity:0;} }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const ANTHROPIC_API_KEY = "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";

const SBA = "&sfm%5BtypeOfSetAside%5D=SBA&sfm%5BsetAside%5D%5B0%5D%5Bkey%5D=SBA&sfm%5BsetAside%5D%5B0%5D%5Bvalue%5D=Total%20Small%20Business%20Set-Aside%20(FAR%2019.5)";
const BASE = "https://sam.gov/search/?index=opp&page=1&pageSize=25&sort=-modifiedDate&sfm%5Bstatus%5D%5Bis_active%5D=true&sfm%5BsimpleSearch%5D%5BkeywordRadio%5D=ALL";

function naics(sector, code) {
  return "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bkey%5D=" + sector + "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bvalue%5D=" + code;
}
function kw(word) {
  return "&sfm%5BsimpleSearch%5D%5BkeywordTags%5D%5B0%5D=" + encodeURIComponent(word);
}

// Bio Pharma — 3 NAICS codes, show first one for "All", use pharmaceutical for best match
// We show multiple NAICS by linking each separately
const CATEGORIES = [
  {
    id: "biotech",
    icon: "🧬",
    label: "Bio Pharma Training",
    naicsLabel: "NAICS 611519 · 611430 · 541714",
    description: "Biotech & pharmaceutical manufacturing training — NIH, FDA, DOD, NJ state agencies.",
    accentColor: "#00c887",
    allUrls: [
      { label: "611519 — Pharma Technical", url: BASE + naics("61","611519") + SBA },
      { label: "611430 — Biotech Training", url: BASE + naics("61","611430") + SBA },
      { label: "541714 — Biotech R&D", url: BASE + naics("54","541714") + SBA },
    ],
    bestUrl: BASE + kw("pharmaceutical") + naics("61","611519") + SBA,
    bestLabel: "pharmaceutical + NAICS 611519",
  },
  {
    id: "it",
    icon: "💻",
    label: "IT / Computer Training",
    naicsLabel: "NAICS 611420",
    description: "IT workforce training, computer skills, technical training for federal agencies.",
    accentColor: "#4fc3f7",
    allUrls: [
      { label: "611420 — Computer Training", url: BASE + naics("61","611420") + SBA },
    ],
    bestUrl: BASE + kw("computer training") + naics("61","611420") + SBA,
    bestLabel: "computer training + NAICS 611420",
  },
  {
    id: "marketing",
    icon: "📣",
    label: "Marketing Consulting",
    naicsLabel: "NAICS 541613",
    description: "Marketing strategy, outreach, and communications consulting for federal agencies.",
    accentColor: "#f0c040",
    allUrls: [
      { label: "541613 — Marketing Consulting", url: BASE + naics("54","541613") + SBA },
    ],
    bestUrl: BASE + kw("outreach") + naics("54","541613") + SBA,
    bestLabel: "outreach + NAICS 541613",
  },
];

function ProposalModal({ cat, onClose }) {
  const [text, setText] = React.useState("");
  const [phase, setPhase] = React.useState("idle");
  const [title, setTitle] = React.useState("");
  const [agency, setAgency] = React.useState("");

  async function generate() {
    setPhase("loading"); setText("");
    const prompt = `You are a professional government contract proposal writer for UPVERSION LLC.
COMPANY: UPVERSION LLC | UEI: Q1KPWH41NC57 | CAGE: 16LF8
Owner: Mahezabin Tai, President — biotech manufacturing trainer, institute and government college instructor
Address: 253 Deep Brook Ct, Piscataway, NJ
Certifications: MBE, SBE, Asian-Pacific American Owned
NAICS: 541613, 611420, 611430, 541714, 611519
OPPORTUNITY:
- Title: ${title || cat.label}
- Agency: ${agency || "Federal Agency"}
- Category: ${cat.label} (${cat.naicsLabel})
Write a compelling government proposal:
1. EXECUTIVE SUMMARY
2. COMPANY OVERVIEW & CERTIFICATIONS (highlight MBE/SBE Small Business)
3. TECHNICAL APPROACH
4. PAST PERFORMANCE (3 relevant examples)
5. KEY PERSONNEL (Mahezabin Tai, President)
6. WHY UPVERSION LLC WINS
7. CALL TO ACTION
Formal government tone. Specific and compelling.`;
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json", "x-api-key": ANTHROPIC_API_KEY, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
        body: JSON.stringify({ model: "claude-sonnet-4-20250514", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
      });
      const data = await res.json();
      const full = data.content?.map(c => c.text || "").join("\n") || "Error.";
      setPhase("streaming");
      let i = 0;
      const iv = setInterval(() => { i += 16; setText(full.slice(0, i)); if (i >= full.length) { setText(full); clearInterval(iv); setPhase("done"); } }, 12);
    } catch (e) { setText("Error: " + e.message); setPhase("done"); }
  }

  return (
    <div onClick={onClose} style={{ position:"fixed", inset:0, background:"rgba(0,5,15,0.95)", backdropFilter:"blur(10px)", zIndex:1000, display:"flex", alignItems:"center", justifyContent:"center", padding:16 }}>
      <div onClick={e => e.stopPropagation()} style={{ background:"linear-gradient(160deg,#081828,#0a1e34)", border:"1px solid #1a4060", borderRadius:20, width:"100%", maxWidth:680, maxHeight:"90vh", display:"flex", flexDirection:"column" }}>
        <div style={{ padding:"16px 20px 12px", borderBottom:"1px solid #142a3e", display:"flex", justifyContent:"space-between", alignItems:"center" }}>
          <div>
            <div style={{ color:"#00e5a0", fontSize:10, fontWeight:700, letterSpacing:2 }}>AI PROPOSAL DRAFT</div>
            <div style={{ color:"#ddeeff", fontSize:14, fontWeight:700, fontFamily:"'DM Serif Display',Georgia,serif", marginTop:2 }}>{cat.icon} {cat.label}</div>
          </div>
          <button onClick={onClose} style={{ background:"none", border:"none", color:"#3a6a8a", fontSize:20, cursor:"pointer" }}>✕</button>
        </div>
        {phase === "idle" && (
          <div style={{ padding:"18px 20px" }}>
            <div style={{ color:"#3a6a8a", fontSize:11, fontWeight:700, letterSpacing:1.5, marginBottom:10 }}>PASTE CONTRACT DETAILS FROM SAM.GOV</div>
            <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Contract title from SAM.gov"
              style={{ width:"100%", background:"#060f1c", border:"1px solid #132436", borderRadius:9, padding:"10px 14px", color:"#b8d4ec", fontSize:13, outline:"none", marginBottom:10 }} />
            <input value={agency} onChange={e => setAgency(e.target.value)} placeholder="Agency name (e.g. NIH, Army, VA, NJ State)"
              style={{ width:"100%", background:"#060f1c", border:"1px solid #132436", borderRadius:9, padding:"10px 14px", color:"#b8d4ec", fontSize:13, outline:"none", marginBottom:16 }} />
            <button onClick={generate} style={{ width:"100%", background:"linear-gradient(135deg,#00c887,#0088cc)", color:"#001a10", border:"none", borderRadius:11, padding:13, fontWeight:800, fontSize:15, cursor:"pointer" }}>
              ✦ Generate Proposal with AI
            </button>
          </div>
        )}
        {phase !== "idle" && (
          <div style={{ flex:1, overflowY:"auto", padding:"16px 20px" }}>
            {phase === "loading" && (
              <div style={{ color:"#4fc3f7", fontSize:14, padding:"30px 0", display:"flex", alignItems:"center", gap:10 }}>
                <span style={{ animation:"spin 1s linear infinite", display:"inline-block" }}>◌</span>
                Drafting your proposal…
              </div>
            )}
            <pre style={{ color:"#b8d4ec", fontSize:13, lineHeight:1.8, whiteSpace:"pre-wrap", wordBreak:"break-word", fontFamily:"'IBM Plex Mono',monospace" }}>
              {text}{phase === "streaming" && <span style={{ animation:"blink 0.7s infinite", color:"#00e5a0" }}>▌</span>}
            </pre>
          </div>
        )}
        {phase === "done" && (
          <div style={{ padding:"12px 20px", borderTop:"1px solid #142a3e", display:"flex", gap:10 }}>
            <button onClick={() => navigator.clipboard.writeText(text)} style={{ background:"#0a2030", color:"#4fc3f7", border:"1px solid #1a4060", borderRadius:10, padding:"9px 16px", fontWeight:600, fontSize:12, cursor:"pointer" }}>📋 Copy</button>
            <button onClick={() => { setPhase("idle"); setText(""); }} style={{ background:"#0a2030", color:"#6a8aa8", border:"1px solid #142a3e", borderRadius:10, padding:"9px 16px", fontWeight:600, fontSize:12, cursor:"pointer" }}>↺ Redo</button>
            <button onClick={onClose} style={{ marginLeft:"auto", background:"linear-gradient(135deg,#00c887,#009966)", color:"#001a10", border:"none", borderRadius:10, padding:"9px 22px", fontWeight:800, fontSize:13, cursor:"pointer" }}>Done ✓</button>
          </div>
        )}
      </div>
    </div>
  );
}

function CategoryCard({ cat, onDraft }) {
  const [showAll, setShowAll] = React.useState(false);
  const c = cat.accentColor;

  return (
    <div style={{ background:"linear-gradient(135deg,#0d1f30,#0f2438)", border:`1px solid ${c}22`, borderRadius:16, marginBottom:16, overflow:"hidden", boxShadow:`0 2px 20px ${c}10` }}>
      <div style={{ padding:"20px 22px" }}>

        {/* Header */}
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14 }}>
          <div>
            <div style={{ fontSize:28, marginBottom:6 }}>{cat.icon}</div>
            <div style={{ color:"#ddeeff", fontSize:18, fontWeight:700, fontFamily:"'DM Serif Display',Georgia,serif" }}>{cat.label}</div>
            <div style={{ color:c, fontSize:10, fontWeight:700, marginTop:3, letterSpacing:0.5 }}>{cat.naicsLabel}</div>
            <div style={{ color:"#5a8aaa", fontSize:12, lineHeight:1.6, marginTop:6, maxWidth:480 }}>{cat.description}</div>
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:4, alignItems:"flex-end", flexShrink:0, marginLeft:12 }}>
            <span style={{ background:c+"18", border:`1px solid ${c}40`, color:c, fontSize:9, padding:"3px 8px", borderRadius:10, fontWeight:700 }}>SMALL BIZ</span>
            <span style={{ background:"#0a2030", border:"1px solid #1a4060", color:"#4fc3f7", fontSize:9, padding:"3px 8px", borderRadius:10, fontWeight:700 }}>ACTIVE</span>
            <span style={{ background:"#0a2030", border:"1px solid #1a4060", color:"#4fc3f7", fontSize:9, padding:"3px 8px", borderRadius:10, fontWeight:700 }}>USA ONLY</span>
          </div>
        </div>

        {/* Divider */}
        <div style={{ borderTop:`1px solid ${c}18`, marginBottom:14 }} />

        {/* Button Row */}
        <div style={{ display:"flex", gap:10, flexWrap:"wrap" }}>

          {/* ALL button — toggles NAICS links */}
          <div style={{ flex:1, minWidth:120 }}>
            <button onClick={() => setShowAll(!showAll)}
              style={{ width:"100%", background: showAll ? c : "#0a2030", color: showAll ? "#001a10" : c, border:`1px solid ${c}50`, borderRadius:12, padding:"12px", fontWeight:800, fontSize:13, cursor:"pointer", transition:"all 0.2s" }}>
              🔍 All Contracts {showAll ? "▲" : "▼"}
            </button>
            {showAll && (
              <div style={{ marginTop:8, display:"flex", flexDirection:"column", gap:6 }}>
                {cat.allUrls.map((u, i) => (
                  <a key={i} href={u.url} target="_blank" rel="noopener noreferrer"
                    style={{ background:"#060f1c", color:c, border:`1px solid ${c}30`, borderRadius:10, padding:"9px 14px", fontSize:12, fontWeight:600, textDecoration:"none", display:"block" }}>
                    {u.label} ↗
                  </a>
                ))}
              </div>
            )}
          </div>

          {/* BEST MATCH button */}
          <div style={{ flex:1, minWidth:120 }}>
            <a href={cat.bestUrl} target="_blank" rel="noopener noreferrer"
              style={{ display:"block", background:`linear-gradient(135deg,${c},${c}99)`, color:"#001a10", borderRadius:12, padding:"12px", fontWeight:800, fontSize:13, textDecoration:"none", textAlign:"center" }}>
              ⭐ Best Match ↗
            </a>
            <div style={{ color:"#2a5a78", fontSize:10, marginTop:5, textAlign:"center" }}>{cat.bestLabel}</div>
          </div>

          {/* DRAFT PROPOSAL button */}
          <div style={{ flex:1, minWidth:120 }}>
            <button onClick={() => onDraft(cat)}
              style={{ width:"100%", background:"linear-gradient(135deg,#00c887,#009966)", color:"#001a10", border:"none", borderRadius:12, padding:"12px", fontWeight:800, fontSize:13, cursor:"pointer" }}>
              ✦ Draft Proposal
            </button>
            <div style={{ color:"#2a5a78", fontSize:10, marginTop:5, textAlign:"center" }}>AI writes your proposal</div>
          </div>

        </div>
      </div>
    </div>
  );
}

function App() {
  const [draftCat, setDraftCat] = React.useState(null);
  const [activeTab, setActiveTab] = React.useState("all");

  const tabs = [
    { id:"all", label:"All" },
    { id:"biotech", label:"🧬 Bio Pharma" },
    { id:"it", label:"💻 IT Training" },
    { id:"marketing", label:"📣 Marketing" },
  ];

  const filtered = activeTab === "all" ? CATEGORIES : CATEGORIES.filter(c => c.id === activeTab);

  return (
    <div style={{ minHeight:"100vh", background:"linear-gradient(160deg,#020c18 0%,#040e1e 50%,#020a14 100%)" }}>

      {/* Header */}
      <div style={{ background:"rgba(4,14,30,0.96)", backdropFilter:"blur(14px)", borderBottom:"1px solid #0e2034", padding:"14px 20px", display:"flex", justifyContent:"space-between", alignItems:"center", position:"sticky", top:0, zIndex:100 }}>
        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
          <div style={{ width:34, height:34, borderRadius:8, background:"linear-gradient(135deg,#00c887,#0088cc)", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:900, fontSize:13, color:"#001a10" }}>UV</div>
          <div>
            <div style={{ fontFamily:"'DM Serif Display',Georgia,serif", fontSize:17 }}>UPVERSION LLC</div>
            <div style={{ fontSize:9, color:"#2a6a8a", letterSpacing:1.5, fontWeight:700 }}>SAM.GOV CONTRACT INTELLIGENCE</div>
          </div>
        </div>
        <div style={{ display:"flex", gap:6 }}>
          {["MBE","SBE","NJ"].map(c => <span key={c} style={{ background:"#00c88712", border:"1px solid #00c88728", color:"#00e5a0", fontSize:9, padding:"2px 8px", borderRadius:12, fontWeight:700 }}>{c}</span>)}
        </div>
      </div>

      <div style={{ maxWidth:860, margin:"0 auto", padding:"20px 16px" }}>

        {/* Company Card */}
        <div style={{ background:"linear-gradient(135deg,#0c1c2e,#0a1a28)", border:"1px solid #132436", borderRadius:16, padding:"16px 20px", marginBottom:18 }}>
          <div style={{ color:"#2a6a8a", fontSize:10, fontWeight:700, letterSpacing:2, marginBottom:10 }}>REGISTERED ENTITY</div>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))", gap:"8px 16px" }}>
            {[["UEI","Q1KPWH41NC57"],["CAGE","16LF8"],["President","Mahezabin Tai"],["Location","Piscataway, NJ"],["Expertise","Biotech Manufacturing Trainer"],["Certifications","MBE · SBE · Asian-Pacific"]].map(([k,v]) => (
              <div key={k}>
                <div style={{ color:"#2a5a78", fontSize:10, fontWeight:700, letterSpacing:1, marginBottom:2 }}>{k}</div>
                <div style={{ color:"#9abcd4", fontSize:12 }}>{v}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Tabs */}
        <div style={{ display:"flex", gap:8, marginBottom:18, flexWrap:"wrap" }}>
          {tabs.map(t => (
            <button key={t.id} onClick={() => setActiveTab(t.id)}
              style={{ background:activeTab===t.id?"linear-gradient(135deg,#00c887,#0088cc)":"#0a1a28", color:activeTab===t.id?"#001a10":"#4a8aaa", border:activeTab===t.id?"none":"1px solid #132436", borderRadius:20, padding:"8px 20px", fontWeight:700, fontSize:13, cursor:"pointer" }}>
              {t.label}
            </button>
          ))}
        </div>

        {filtered.map(cat => <CategoryCard key={cat.id} cat={cat} onDraft={setDraftCat} />)}

        {/* How to use */}
        <div style={{ background:"linear-gradient(135deg,#0a1e10,#081a0e)", border:"1px solid #0a3a1a", borderRadius:16, padding:"18px 20px", marginTop:8 }}>
          <div style={{ color:"#00c887", fontSize:11, fontWeight:700, letterSpacing:2, marginBottom:12 }}>📋 HOW TO USE</div>
          {[
            ["🔍","All Contracts","Shows every SBA + Active contract for that NAICS — broad search, scroll to find your fit"],
            ["⭐","Best Match","NAICS + validated keyword — most targeted results, fewer but highly relevant"],
            ["✦","Draft Proposal","Find a contract on SAM.gov, come back, paste the title + agency, get a full AI proposal"],
          ].map(([icon,t,d]) => (
            <div key={t} style={{ display:"flex", gap:12, marginBottom:12, alignItems:"flex-start" }}>
              <div style={{ width:28, height:28, borderRadius:"50%", background:"linear-gradient(135deg,#00c887,#009966)", color:"#001a10", display:"flex", alignItems:"center", justifyContent:"center", fontSize:14, flexShrink:0 }}>{icon}</div>
              <div>
                <div style={{ color:"#00e5a0", fontSize:13, fontWeight:700, marginBottom:2 }}>{t}</div>
                <div style={{ color:"#2a6a44", fontSize:12, lineHeight:1.5 }}>{d}</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      <div style={{ textAlign:"center", padding:"20px", color:"#0e2a40", fontSize:11, borderTop:"1px solid #0a1e30", marginTop:20 }}>
        UPVERSION LLC · UEI Q1KPWH41NC57 · Piscataway, NJ · Small Business · Active · USA · Powered by Claude AI + SAM.gov
      </div>

      {draftCat && <ProposalModal cat={draftCat} onClose={() => setDraftCat(null)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
