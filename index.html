<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UPVERSION LLC — Contract Intelligence</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Merriweather:wght@700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0d1b2a; font-family: 'Source Sans 3', sans-serif; color: #ddeeff; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #f0f0f0; }
::-webkit-scrollbar-thumb { background: #b0c4d8; border-radius: 3px; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes blink { 0%,100%{opacity:1;}50%{opacity:0;} }
@keyframes pulse { 0%,100%{opacity:0.7;transform:scale(1);}50%{opacity:1;transform:scale(1.04);} }
@keyframes slideUp { from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);} }
.btn-hover:hover { filter: brightness(1.08); transform: translateY(-1px); transition: all 0.15s; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const BASE = "https://sam.gov/search/?index=opp&page=1&pageSize=25&sort=-modifiedDate&sfm%5Bstatus%5D%5Bis_active%5D=true&sfm%5BsimpleSearch%5D%5BkeywordRadio%5D=ALL";

function makeUrl(sector, code, keyword) {
  let url = BASE;
  if (keyword) url += "&sfm%5BsimpleSearch%5D%5BkeywordTags%5D%5B0%5D=" + encodeURIComponent(keyword);
  url += "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bkey%5D=" + sector;
  url += "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bvalue%5D=" + code;
  url += "&sfm%5BplaceOfPerformance%5D%5Bcountry%5D%5B0%5D%5Bkey%5D=USA&sfm%5BplaceOfPerformance%5D%5Bcountry%5D%5B0%5D%5Bvalue%5D=United%20States";
  return url;
}

function makeAwardUrl(sector, code) {
  let url = "https://sam.gov/search/?index=awd&page=1&pageSize=25&sort=-modifiedDate&sfm%5Bstatus%5D%5Bis_active%5D=true&sfm%5BsimpleSearch%5D%5BkeywordRadio%5D=ALL";
  url += "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bkey%5D=" + sector;
  url += "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bvalue%5D=" + code;
  url += "&sfm%5BplaceOfPerformance%5D%5Bcountry%5D%5B0%5D%5Bkey%5D=USA&sfm%5BplaceOfPerformance%5D%5Bcountry%5D%5B0%5D%5Bvalue%5D=United%20States";
  return url;
}

function extractNoticeId(url) {
  if (!url) return "";
  const m = url.match(/opp\/([a-zA-Z0-9]+)\//);
  return m ? m[1] : "";
}

function readFilesAsText(files) {
  return Promise.all(Array.from(files).map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => resolve({ name: file.name, content: e.target.result, size: file.size });
    reader.onerror = () => resolve({ name: file.name, content: "[Could not read file]", size: file.size });
    reader.readAsText(file);
  })));
}

const CATEGORIES = [
  { id:"biotech", icon:"🧬", label:"Bio Pharma", description:"Biotech & pharmaceutical R&D and technical training — NIH, FDA, DOD, NJ state agencies.", color:"#00a86b",
    naicsRows:[
      {naics:"611519",sector:"61",label:"611519 — Other Technical and Trade Schools",bestKw:"pharmaceutical"},
      {naics:"541714",sector:"54",label:"541714 — R&D in Biotechnology",bestKw:"biotechnology"},
      {naics:"541715",sector:"54",label:"541715 — R&D in Physical, Engineering & Life Sciences",bestKw:"life sciences"},
    ]},
  { id:"it", icon:"💻", label:"IT Training", description:"Computer training, IT workforce development, and technical skills training for federal agencies.", color:"#1a6fb5",
    naicsRows:[{naics:"611420",sector:"61",label:"611420 — Computer Training",bestKw:"training"}]},
  { id:"marketing", icon:"📣", label:"Marketing", description:"Marketing consulting, outreach campaigns, and communications strategy for federal agencies.", color:"#c45c00",
    naicsRows:[{naics:"541613",sector:"54",label:"541613 — Marketing Consulting Services",bestKw:"marketing services"}]},
  { id:"management", icon:"🎓", label:"Management Training", description:"Professional development, management training, and administrative consulting.", color:"#6b21a8",
    naicsRows:[
      {naics:"611430",sector:"61",label:"611430 — Professional and Management Development Training",bestKw:"management training"},
      {naics:"541611",sector:"54",label:"541611 — Administrative Management and General Management Consulting",bestKw:"management consulting"},
    ]},
];

const TABS = [
  {id:"all",label:"All Categories"},
  {id:"biotech",label:"🧬 Bio Pharma"},
  {id:"it",label:"💻 IT Training"},
  {id:"marketing",label:"📣 Marketing"},
  {id:"management",label:"🎓 Management"},
];

const PAGE_READING_MSGS = ["🌐 Opening the SAM.gov contract page...","📡 Reading contract details...","🔍 Scanning requirements...","📋 Capturing agency info...","✨ Page read complete!"];
const READING_MSGS = ["🔍 Scanning your attachments...","📄 Extracting requirements...","🧠 Understanding technical scope...","📋 Identifying criteria...","✨ Building proposal intelligence..."];
const DRAFTING_MSGS = ["✍️ Crafting Executive Summary...","🏢 Writing Company Overview...","⚙️ Developing Technical Approach...","📊 Documenting Past Performance...","🏆 Making the winning argument..."];
const QUALITY_MSGS = ["🔬 Checking requirement coverage...","✅ Verifying certifications...","📐 Scoring technical approach...","🏅 Calculating win score..."];

function useRotatingMsg(msgs, active, interval=1800) {
  const [idx, setIdx] = React.useState(0);
  React.useEffect(() => {
    if (!active) return;
    const t = setInterval(() => setIdx(i => (i+1) % msgs.length), interval);
    return () => clearInterval(t);
  }, [active]);
  return msgs[idx];
}

function ProposalModal({ row, cat, onClose }) {
  const [phase, setPhase] = React.useState("input");
  const [noticeId, setNoticeId] = React.useState("");
  const [samUrl, setSamUrl] = React.useState("");
  const [title, setTitle] = React.useState("");
  const [agency, setAgency] = React.useState("");
  const [files, setFiles] = React.useState([]);
  const [dragging, setDragging] = React.useState(false);
  const [showUpload, setShowUpload] = React.useState(false);
  const [readPage, setReadPage] = React.useState(true);
  const [proposal, setProposal] = React.useState("");
  const [qualityScore, setQualityScore] = React.useState(null);
  const [qualityChecks, setQualityChecks] = React.useState([]);
  const [humanChecks, setHumanChecks] = React.useState([]);
  const [saved, setSaved] = React.useState(false);
  const fileRef = React.useRef();

  const pageReadingMsg = useRotatingMsg(PAGE_READING_MSGS, phase==="readingPage");
  const readingMsg = useRotatingMsg(READING_MSGS, phase==="reading");
  const draftingMsg = useRotatingMsg(DRAFTING_MSGS, phase==="drafting");
  const qualityMsg = useRotatingMsg(QUALITY_MSGS, phase==="quality");

  const detectedId = extractNoticeId(samUrl);
  const resolvedId = noticeId || detectedId;

  React.useEffect(() => {
    const handleKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", handleKey);
    return () => window.removeEventListener("keydown", handleKey);
  }, []);

  function handleDrop(e) { e.preventDefault(); setDragging(false); setFiles(prev => [...prev, ...Array.from(e.dataTransfer.files)]); }
  function handleFileInput(e) { setFiles(prev => [...prev, ...Array.from(e.target.files)]); }
  function removeFile(i) { setFiles(prev => prev.filter((_,idx) => idx !== i)); }

  async function generate() {
    let pageContext = "";
    if (readPage && samUrl) {
      setPhase("readingPage");
      try {
        const r = await fetch("https://upversion-contracts.vercel.app/api/proposal", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({prompt:"Read page", fetchUrl: samUrl}),
        });
        const d = await r.json();
        if (d.pageRead) pageContext = d.pagePreview || "";
      } catch(e) {}
      await new Promise(r => setTimeout(r, 2000));
    }

    let attachmentContext = "";
    if (files.length > 0) {
      setPhase("reading");
      await new Promise(r => setTimeout(r, 2500));
      const fc = await readFilesAsText(files);
      attachmentContext = fc.map(f => `\n--- ${f.name} ---\n${f.content.slice(0,3000)}`).join("\n");
    }

    setPhase("drafting");
    const prompt = `You are UpAI, a professional government contract proposal writer for UPVERSION LLC.
COMPANY: UPVERSION LLC | UEI: Q1KPWH41NC57 | CAGE: 16LF8
Owner: Mahezabin Tai, President — biotech manufacturing trainer
Address: 253 Deep Brook Ct, Piscataway, NJ
Certifications: MBE, SBE, Asian-Pacific American Owned
NAICS: 541613, 541611, 611420, 611430, 541714, 541715, 611519
OPPORTUNITY:
- Category: ${cat.label}
- NAICS: ${row.naics} — ${row.label}
- Notice ID: ${resolvedId || "See solicitation"}
- Title: ${title || "See solicitation"}
- Agency: ${agency || "Federal Agency"}
${pageContext ? `\n--- SAM.GOV PAGE ---\n${pageContext}` : ""}
${attachmentContext ? `\n--- ATTACHMENTS ---\n${attachmentContext}` : ""}
Write a compelling government proposal:
1. EXECUTIVE SUMMARY
2. COMPANY OVERVIEW & CERTIFICATIONS
3. TECHNICAL APPROACH
4. PAST PERFORMANCE (3 examples)
5. KEY PERSONNEL (Mahezabin Tai)
6. WHY UPVERSION LLC WINS
7. CALL TO ACTION`;

    try {
      const res = await fetch("https://upversion-contracts.vercel.app/api/proposal", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({prompt}),
      });
      const data = await res.json();
      const full = (data.content && data.content.map(c=>c.text||"").join("\n")) || "Error generating proposal.";
      setProposal(full);
      try {
        localStorage.setItem("upai_last_proposal", JSON.stringify({proposal:full,noticeId:resolvedId,title,agency,naics:row.naics,savedAt:new Date().toISOString(),cat:cat.label}));
        setSaved(true);
      } catch(e) {}

      setPhase("quality");
      await new Promise(r => setTimeout(r, 2000));

      const qPrompt = `Review this government proposal and return ONLY valid JSON (no markdown):
{"score":<0-100>,"checks":[{"label":"Executive Summary","status":"pass|warn|fail","note":"brief"},{"label":"Certifications","status":"pass|warn|fail","note":"brief"},{"label":"Technical Approach","status":"pass|warn|fail","note":"brief"},{"label":"Past Performance","status":"pass|warn|fail","note":"brief"},{"label":"Key Personnel","status":"pass|warn|fail","note":"brief"},{"label":"Differentiators","status":"pass|warn|fail","note":"brief"},{"label":"Call to Action","status":"pass|warn|fail","note":"brief"},{"label":"Compliance Tone","status":"pass|warn|fail","note":"brief"}]}
PROPOSAL:\n${full.slice(0,3000)}`;

      const qRes = await fetch("https://upversion-contracts.vercel.app/api/proposal", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({prompt: qPrompt}),
      });
      const qData = await qRes.json();
      const qText = (qData.content && qData.content.map(c=>c.text||"").join("")) || "{}";
      try {
        const parsed = JSON.parse(qText.replace(/```json|```/g,"").trim());
        setQualityScore(parsed.score);
        setQualityChecks(parsed.checks || []);
        setHumanChecks([
          {label:"Past performance examples are accurate",checked:false},
          {label:"All requirements are addressed",checked:false},
          {label:"Pricing/cost is realistic",checked:false},
          {label:"Someone else has reviewed this",checked:false},
          {label:"Ready to submit",checked:false},
        ]);
      } catch(e) { setQualityScore(75); setQualityChecks([]); }
      setPhase("done");
    } catch(e) { setProposal("Error: "+e.message); setPhase("done"); }
  }

  function toggleHumanCheck(i) { setHumanChecks(prev => prev.map((c,idx) => idx===i ? {...c,checked:!c.checked} : c)); }
  const humanDone = humanChecks.length > 0 && humanChecks.every(c=>c.checked);
  const statusIcon = s => s==="pass"?"✅":s==="warn"?"⚠️":"❌";
  const scoreColor = qualityScore>=80?"#00a86b":qualityScore>=60?"#c45c00":"#c0392b";

  const inputStyle = {width:"100%",background:"#fff",border:"1px solid #c6d2db",borderRadius:4,padding:"8px 12px",color:"#1b2a32",fontSize:14,outline:"none",fontFamily:"'Source Sans 3',sans-serif"};

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.5)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#fff",borderRadius:4,border:"1px solid #c6d2db",width:"100%",maxWidth:700,maxHeight:"92vh",display:"flex",flexDirection:"column",boxShadow:"0 4px 20px rgba(0,0,0,0.15)",animation:"slideUp 0.2s ease"}}>

        {/* SAM.gov style header */}
        <div style={{background:"#1b2a32",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",flexShrink:0}}>
          <div>
            <div style={{color:"#00c887",fontSize:11,fontWeight:700,letterSpacing:1.5,marginBottom:2}}>UpAI — CONTRACT PROPOSAL DRAFT</div>
            <div style={{color:"#fff",fontSize:14,fontWeight:700}}>{cat.icon} {cat.label} · NAICS {row.naics}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"1px solid #ffffff40",color:"#fff",borderRadius:4,padding:"4px 12px",cursor:"pointer",fontSize:13}}>✕ Close</button>
        </div>

        {/* Input Phase */}
        {phase==="input" && (
          <div style={{overflowY:"auto",padding:"20px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:16}}>
              <div>
                <label style={{fontSize:13,fontWeight:700,color:"#1b2a32",display:"block",marginBottom:5}}>Notice ID</label>
                <input value={noticeId} onChange={e=>setNoticeId(e.target.value)} placeholder="e.g. W9124X26QA014" style={inputStyle}/>
                {noticeId && <div style={{color:"#00a86b",fontSize:12,marginTop:4}}>✓ Notice ID entered</div>}
              </div>
              <div>
                <label style={{fontSize:13,fontWeight:700,color:"#1b2a32",display:"block",marginBottom:5}}>Agency Name <span style={{color:"#6b7c8a",fontWeight:400}}>(optional)</span></label>
                <input value={agency} onChange={e=>setAgency(e.target.value)} placeholder="e.g. Dept of Army, NIH, VA" style={inputStyle}/>
              </div>
            </div>

            <div style={{marginBottom:16}}>
              <label style={{fontSize:13,fontWeight:700,color:"#1b2a32",display:"block",marginBottom:5}}>Contract Title <span style={{color:"#6b7c8a",fontWeight:400}}>(optional)</span></label>
              <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Paste contract title from SAM.gov" style={inputStyle}/>
            </div>

            <div style={{marginBottom:16}}>
              <label style={{fontSize:13,fontWeight:700,color:"#1b2a32",display:"block",marginBottom:5}}>Full SAM.gov URL <span style={{color:"#6b7c8a",fontWeight:400}}>(optional)</span></label>
              <input value={samUrl} onChange={e=>setSamUrl(e.target.value)} placeholder="https://sam.gov/opp/.../view" style={inputStyle}/>
              {samUrl && detectedId && <div style={{color:"#00a86b",fontSize:12,marginTop:4}}>✓ Notice ID auto-detected: {detectedId}</div>}
              {samUrl && (
                <div onClick={()=>setReadPage(!readPage)}
                  style={{display:"flex",alignItems:"center",gap:8,marginTop:8,cursor:"pointer",padding:"8px 12px",background:readPage?"#e8f5f0":"#f5f7fa",border:`1px solid ${readPage?"#00a86b":"#c6d2db"}`,borderRadius:4}}>
                  <div style={{width:16,height:16,border:`2px solid ${readPage?"#00a86b":"#6b7c8a"}`,background:readPage?"#00a86b":"#fff",borderRadius:2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {readPage && <span style={{color:"#fff",fontSize:11,fontWeight:900}}>✓</span>}
                  </div>
                  <div>
                    <div style={{color:"#1b2a32",fontSize:13,fontWeight:700}}>🌐 Let UpAI read the contract page first</div>
                    <div style={{color:"#6b7c8a",fontSize:12}}>UpAI will scan the SAM.gov page for all available details before drafting</div>
                  </div>
                </div>
              )}
            </div>

            <div style={{borderTop:"1px solid #e5eaee",paddingTop:16,marginBottom:16}}>
              {!showUpload ? (
                <div style={{background:"#f0faf6",border:"1px solid #b3deca",borderRadius:4,padding:"14px 16px"}}>
                  <div style={{color:"#1b2a32",fontSize:13,fontWeight:700,marginBottom:4}}>📎 Want a more targeted proposal?</div>
                  <div style={{color:"#4a6572",fontSize:13,marginBottom:12}}>Download attachments from SAM.gov (SOW, technical docs, forms) and upload them. UpAI will read everything before drafting.</div>
                  <button onClick={()=>setShowUpload(true)} style={{background:"#fff",color:"#1a6fb5",border:"1px solid #1a6fb5",borderRadius:4,padding:"7px 16px",fontWeight:700,fontSize:13,cursor:"pointer"}}>
                    📎 Upload Attachments
                  </button>
                </div>
              ) : (
                <div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <label style={{fontSize:13,fontWeight:700,color:"#1b2a32"}}>Upload Attachments</label>
                    <button onClick={()=>setShowUpload(false)} style={{background:"none",border:"none",color:"#1a6fb5",fontSize:12,cursor:"pointer",textDecoration:"underline"}}>Skip</button>
                  </div>
                  <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop} onClick={()=>fileRef.current.click()}
                    style={{border:`2px dashed ${dragging?"#00a86b":"#c6d2db"}`,borderRadius:4,padding:"20px",textAlign:"center",cursor:"pointer",background:dragging?"#f0faf6":"#f5f7fa"}}>
                    <div style={{fontSize:24,marginBottom:6}}>📁</div>
                    <div style={{color:"#4a6572",fontSize:13}}>{dragging?"Drop files here!":"Drag & drop or click to browse"}</div>
                    <div style={{color:"#8a9baa",fontSize:12,marginTop:4}}>PDF, DOCX, TXT supported</div>
                    <input ref={fileRef} type="file" multiple accept=".pdf,.docx,.txt,.doc" onChange={handleFileInput} style={{display:"none"}}/>
                  </div>
                  {files.length > 0 && (
                    <div style={{marginTop:10}}>
                      {files.map((f,i)=>(
                        <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#f0faf6",border:"1px solid #b3deca",borderRadius:4,padding:"6px 12px",marginBottom:5}}>
                          <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <span>📄</span>
                            <div>
                              <div style={{color:"#1b2a32",fontSize:13,fontWeight:600}}>{f.name}</div>
                              <div style={{color:"#6b7c8a",fontSize:11}}>{(f.size/1024).toFixed(1)} KB</div>
                            </div>
                          </div>
                          <button onClick={()=>removeFile(i)} style={{background:"none",border:"none",color:"#c0392b",cursor:"pointer",fontSize:16}}>✕</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}
            </div>

            <button onClick={generate} disabled={!resolvedId&&!title&&!agency}
              style={{width:"100%",background:(resolvedId||title||agency)?"#1a6fb5":"#c6d2db",color:"#fff",border:"none",borderRadius:4,padding:"12px",fontWeight:700,fontSize:15,cursor:(resolvedId||title||agency)?"pointer":"not-allowed"}}>
              {files.length>0?`✦ UpAI — Read ${files.length} File${files.length>1?"s":""} & Draft Proposal`:"✦ UpAI — Generate Proposal"}
            </button>
            {!resolvedId&&!title&&!agency && <div style={{color:"#6b7c8a",fontSize:12,textAlign:"center",marginTop:6}}>Enter at least one field above to continue</div>}
          </div>
        )}

        {/* Progress phases */}
        {["readingPage","reading","drafting","quality"].includes(phase) && (
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px",gap:16}}>
            <div style={{width:60,height:60,borderRadius:"50%",background:phase==="readingPage"?"#1a6fb5":phase==="reading"?"#00a86b":phase==="drafting"?"#1b2a32":"#c45c00",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,animation:"pulse 1.5s infinite"}}>
              {phase==="readingPage"?"🌐":phase==="reading"?"📄":phase==="drafting"?"✍️":"🔬"}
            </div>
            <div style={{color:"#1b2a32",fontSize:15,fontWeight:700,textAlign:"center"}}>
              {phase==="readingPage"?pageReadingMsg:phase==="reading"?readingMsg:phase==="drafting"?draftingMsg:qualityMsg}
            </div>
            <div style={{display:"flex",gap:6}}>
              {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:"#1a6fb5",animation:`pulse 1s ${i*0.3}s infinite`}}/>)}
            </div>
            <div style={{color:"#6b7c8a",fontSize:13,textAlign:"center"}}>UpAI is working on your proposal...</div>
          </div>
        )}

        {/* Done */}
        {phase==="done" && (
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {qualityScore!==null && (
              <div style={{padding:"14px 20px",borderBottom:"1px solid #e5eaee",background:"#f5f7fa",flexShrink:0}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                  <div style={{color:"#1b2a32",fontSize:13,fontWeight:700}}>UpAI Quality Report</div>
                  <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <div style={{color:scoreColor,fontSize:22,fontWeight:900}}>{qualityScore}%</div>
                    <div style={{background:scoreColor,color:"#fff",fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:700}}>
                      {qualityScore>=80?"Strong":qualityScore>=60?"Good":"Needs Work"}
                    </div>
                  </div>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:5,marginBottom:12}}>
                  {qualityChecks.map((c,i)=>(
                    <div key={i} style={{display:"flex",gap:6,background:"#fff",border:"1px solid #e5eaee",borderRadius:4,padding:"5px 8px"}}>
                      <span style={{fontSize:12}}>{statusIcon(c.status)}</span>
                      <div>
                        <div style={{color:"#1b2a32",fontSize:11,fontWeight:600}}>{c.label}</div>
                        <div style={{color:"#6b7c8a",fontSize:10}}>{c.note}</div>
                      </div>
                    </div>
                  ))}
                </div>
                <div style={{color:"#1b2a32",fontSize:12,fontWeight:700,marginBottom:6}}>Your Review Checklist</div>
                {humanChecks.map((c,i)=>(
                  <div key={i} onClick={()=>toggleHumanCheck(i)}
                    style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",cursor:"pointer",background:c.checked?"#f0faf6":"#fff",border:`1px solid ${c.checked?"#00a86b":"#e5eaee"}`,borderRadius:4,marginBottom:4}}>
                    <div style={{width:16,height:16,border:`2px solid ${c.checked?"#00a86b":"#6b7c8a"}`,background:c.checked?"#00a86b":"#fff",borderRadius:2,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                      {c.checked&&<span style={{color:"#fff",fontSize:10,fontWeight:900}}>✓</span>}
                    </div>
                    <span style={{color:"#1b2a32",fontSize:13}}>{c.label}</span>
                  </div>
                ))}
                {humanDone && (
                  <div style={{marginTop:8,background:"#f0faf6",border:"1px solid #00a86b",borderRadius:4,padding:"8px 12px",textAlign:"center"}}>
                    <div style={{color:"#00a86b",fontSize:13,fontWeight:700}}>🎉 UpAI says: You're ready to submit!</div>
                  </div>
                )}
              </div>
            )}
            <div style={{flex:1,overflowY:"auto",padding:"16px 20px"}}>
              <pre style={{color:"#1b2a32",fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap",wordBreak:"break-word",fontFamily:"'Source Sans 3',sans-serif"}}>{proposal}</pre>
            </div>
          </div>
        )}

        {phase==="done" && (
          <div style={{padding:"12px 20px",borderTop:"1px solid #e5eaee",display:"flex",gap:8,flexShrink:0,background:"#f5f7fa"}}>
            <button onClick={()=>navigator.clipboard.writeText(proposal)} style={{background:"#fff",color:"#1a6fb5",border:"1px solid #1a6fb5",borderRadius:4,padding:"7px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>📋 Copy</button>
            <button onClick={()=>{setPhase("input");setProposal("");setQualityScore(null);setQualityChecks([]);setHumanChecks([]);}} style={{background:"#fff",color:"#6b7c8a",border:"1px solid #c6d2db",borderRadius:4,padding:"7px 14px",fontWeight:700,fontSize:13,cursor:"pointer"}}>↺ Redo</button>
            {saved && <span style={{color:"#00a86b",fontSize:12,display:"flex",alignItems:"center",gap:4}}>💾 Auto-saved to browser</span>}
            <button onClick={onClose} style={{marginLeft:"auto",background:humanDone?"#00a86b":"#1a6fb5",color:"#fff",border:"none",borderRadius:4,padding:"7px 20px",fontWeight:700,fontSize:13,cursor:"pointer"}}>
              {humanDone?"✅ Submit Ready!":"Done"}
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

function CategoryCard({cat, onDraft}) {
  const c = cat.color;
  return (
    <div style={{background:"#fff",border:"1px solid #c6d2db",borderRadius:4,marginBottom:12,boxShadow:"0 1px 4px rgba(0,0,0,0.06)"}}>
      {/* Header */}
      <div style={{padding:"12px 16px",borderBottom:"1px solid #e5eaee",display:"flex",alignItems:"center",justifyContent:"space-between",background:"#f5f7fa"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <span style={{fontSize:18}}>{cat.icon}</span>
          <span style={{color:"#1b2a32",fontSize:15,fontWeight:700}}>{cat.label}</span>
        </div>
        <div style={{display:"flex",gap:6}}>
          <span style={{background:"#e8f5f0",color:"#00a86b",fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:700,border:"1px solid #b3deca"}}>● Active</span>
          <span style={{background:"#e8f0f8",color:"#1a6fb5",fontSize:11,padding:"2px 8px",borderRadius:20,fontWeight:700,border:"1px solid #b3cde8"}}>🇺🇸 USA</span>
        </div>
      </div>
      {/* Description */}
      <div style={{padding:"8px 16px",borderBottom:"1px solid #e5eaee"}}>
        <p style={{color:"#4a6572",fontSize:13}}>{cat.description}</p>
      </div>
      {/* NAICS rows */}
      <div style={{padding:"8px 16px 12px"}}>
        {cat.naicsRows.map((row,i)=>(
          <div key={i} style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:16,padding:"10px 0",borderBottom:i<cat.naicsRows.length-1?"1px solid #e5eaee":"none"}}>
            <div style={{flex:1,minWidth:0}}>
              <div style={{color:c,fontSize:19,fontWeight:700}}>{"NAICS " + row.label}</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:5,flexShrink:0,width:210}}>
              <a href={makeUrl(row.sector,row.naics,row.bestKw)} target="_blank" rel="noopener noreferrer"
                style={{background:c,color:"#fff",borderRadius:4,padding:"7px 12px",fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block",boxShadow:`0 2px 8px ${c}55`}}>
                🎯 Contracts
              </a>
              <button onClick={()=>onDraft(row,cat)}
                style={{background:"#1a6fb5",color:"#fff",border:"none",borderRadius:4,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer",boxShadow:"0 2px 8px #1a6fb555"}}>
                ✦ Draft
              </button>
              <a href={makeAwardUrl(row.sector,row.naics)} target="_blank" rel="noopener noreferrer"
                style={{background:"#f5f0ff",color:"#6b21a8",border:"1px solid #d8b4fe",borderRadius:4,padding:"7px 12px",fontSize:12,fontWeight:700,textDecoration:"none",textAlign:"center",display:"block"}}>
                🏆 Winners
              </a>
            </div>
          </div>
        ))}
      </div>
      <div style={{padding:"6px 16px 10px",borderTop:"1px solid #e5eaee"}}>
        <p style={{color:"#8a9baa",fontSize:11}}>💡 After opening SAM.gov, filter by: Set Aside → Small Business</p>
      </div>
    </div>
  );
}
