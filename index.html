function makeUrl(sector, code, keyword) {
  let url = BASE;
  if (keyword) url += "&sfm%5BsimpleSearch%5D%5BkeywordTags%5D%5B0%5D=" + encodeURIComponent(keyword);
  url += "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bkey%5D=" + sector + "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bvalue%5D=" + code + USA;
  return url;
}

function makeAwardUrl(sector, code) {
  // Dynamic 36-month date range using exact SAM.gov URL format
  const today = new Date();
  const past = new Date();
  past.setMonth(today.getMonth() - 36);

  // ISO format: 2023-05-17T04:00:00.000Z
  function isoFmt(d) {
    return d.getFullYear() + "-" +
      (d.getMonth()+1).toString().padStart(2,"0") + "-" +
      d.getDate().toString().padStart(2,"0") + "T04:00:00.000Z";
  }
  // Short format: 05%2F17%2F2023
  function shortFmt(d) {
    return encodeURIComponent(
      (d.getMonth()+1).toString().padStart(2,"0") + "/" +
      d.getDate().toString().padStart(2,"0") + "/" +
      d.getFullYear()
    );
  }

  const isoFrom = encodeURIComponent(isoFmt(past));
  const isoTo = encodeURIComponent(isoFmt(today));
  const shortFrom = shortFmt(past);
  const shortTo = shortFmt(today);

  return "https://sam.gov/search/?index=awd&page=1&pageSize=25&sort=-modifiedDate" +
    "&sfm%5Bstatus%5D%5Bis_inactive%5D=true" +
    "&sfm%5BsimpleSearch%5D%5BkeywordRadio%5D=ALL" +
    "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bkey%5D=" + sector +
    "&sfm%5BserviceClassificationWrapper%5D%5Bnaics%5D%5B0%5D%5Bvalue%5D=" + code +
    "&sfm%5Bdates%5D%5BdateSigned%5D%5BdateSignedSelect%5D=customDate" +
    "&sfm%5Bdates%5D%5BdateSigned%5D%5BdateSignedFrom%5D=" + isoFrom +
    "&sfm%5Bdates%5D%5BdateSigned%5D%5BdateSignedTo%5D=" + isoTo +
    "&sfm%5Bdates%5D%5BsignedDate%5D%5Bfrom%5D=" + shortFrom +
    "&sfm%5Bdates%5D%5BsignedDate%5D%5Bto%5D=" + shortTo;
}

function extractNoticeId(url) {
  if (!url) return "";
  const m = url.match(/opp\/([a-zA-Z0-9]+)\//);
  return m ? m[1] : "";
}

function readFilesAsText(files) {
  return Promise.all(Array.from(files).map(file => new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = e => resolve({ name: file.name, content: e.target.result, size: file.size });
    reader.onerror = () => resolve({ name: file.name, content: "[Could not read]", size: file.size });
    reader.readAsText(file);
  })));
}

function useRotatingMsg(msgs, active, interval) {
  const iv = interval || 1800;
  const [idx, setIdx] = React.useState(0);
  React.useEffect(() => {
    if (!active) return;
    const t = setInterval(() => setIdx(i => (i+1) % msgs.length), iv);
    return () => clearInterval(t);
  }, [active]);
  return msgs[idx];
}

function downloadAsWord(proposal, noticeId, title, agency, cat, row) {
  const today = new Date().toLocaleDateString("en-US", {year:"numeric",month:"long",day:"numeric"});
  
  const lines = proposal.split("\n");
  let bodyHtml = "";
  
  lines.forEach(function(line) {
    if (line.startsWith("## ")) bodyHtml += "<h2>" + line.slice(3) + "</h2>";
    else if (line.startsWith("### ")) bodyHtml += "<h3>" + line.slice(4) + "</h3>";
    else if (line.startsWith("# ")) bodyHtml += "<h1>" + line.slice(2) + "</h1>";
    else if (line.startsWith("- ")) bodyHtml += "<li>" + line.slice(2) + "</li>";
    else if (line === "---") bodyHtml += "<hr/>";
    else if (line.trim() === "") bodyHtml += "<br/>";
    else bodyHtml += "<p>" + line.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>") + "</p>";
  });

  bodyHtml = bodyHtml
    .replace(/\[Date\]/g, today)
    .replace(/\[Submission Date\]/g, today);

  const wordDoc = "<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'/><style>body{font-family:Arial,sans-serif;font-size:11pt;margin:1in;color:#1b2a32;}h1{font-size:18pt;color:#1b2a32;border-bottom:2px solid #c0392b;padding-bottom:6pt;}h2{font-size:14pt;color:#1a6fb5;margin-top:18pt;}h3{font-size:12pt;color:#1b2a32;margin-top:12pt;}p{line-height:1.5;margin:6pt 0;}li{margin:3pt 0;}hr{border:1px solid #ccc;margin:12pt 0;}table{border-collapse:collapse;width:100%;}td,th{border:1px solid #ccc;padding:6pt 8pt;font-size:10pt;}th{background-color:#1b2a32;color:white;}</style></head><body>"
    + "<div style='background:#f5f7fa;border-left:4px solid #c0392b;padding:12pt;margin-bottom:18pt;'>"
    + "<strong style='font-size:16pt;'>UPVERSION LLC</strong><br/>"
    + "<span style='color:#c0392b;'>Contract Proposal — Powered by UpAI</span><br/>"
    + "<span style='color:#4a6a8a;font-size:10pt;'>Notice ID: " + (noticeId || "N/A") + " | NAICS: " + row.naics + " | Date: " + today + "</span>"
    + "</div>"
    + bodyHtml
    + "<div style='margin-top:24pt;border-top:1px solid #ccc;padding-top:8pt;font-size:9pt;color:#6b7c8a;font-style:italic;'>UPVERSION LLC | UEI: Q1KPWH41NC57 | CAGE: 16LF8 | 253 Deep Brook Ct, Piscataway, NJ | Generated by UpAI</div>"
    + "</body></html>";

  const blob = new Blob([wordDoc], {type: "application/msword"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "UPVERSION_Proposal_" + (noticeId || "Draft") + "_" + new Date().toISOString().slice(0,10) + ".doc";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

  const qualMsg = useRotatingMsg(QUAL_MSGS, phase==="quality");
  const detectedId = extractNoticeId(samUrl);
  const resolvedId = noticeId || detectedId;

  React.useEffect(() => {
    const h = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  }, []);

  function handleDrop(e) { e.preventDefault(); setDragging(false); setFiles(prev => [...prev, ...Array.from(e.dataTransfer.files)]); }
  function handleFileInput(e) { setFiles(prev => [...prev, ...Array.from(e.target.files)]); }
  function removeFile(i) { setFiles(prev => prev.filter((_,idx2) => idx2 !== i)); }

  async function generate() {
    let pageCtx = "";
    if (readPage && samUrl) {
      setPhase("readingPage");
      try {
        const r = await fetch("https://upversion-contracts.vercel.app/api/proposal", {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({prompt:"Read page", fetchUrl: samUrl}),
        });
        const d = await r.json();
        if (d.pageRead) pageCtx = d.pagePreview || "";
      } catch(e) {}
      await new Promise(r => setTimeout(r, 2000));
    }
    let attCtx = "";
    if (files.length > 0) {
      setPhase("reading");
      await new Promise(r => setTimeout(r, 2000));
      const fc = await readFilesAsText(files);
      attCtx = fc.map(f => "\n--- " + f.name + " ---\n" + f.content.slice(0,3000)).join("\n");
    }
    setPhase("drafting");
    const prompt = "You are UpAI, professional government contract proposal writer for UPVERSION LLC.\nCOMPANY: UPVERSION LLC | UEI: Q1KPWH41NC57 | CAGE: 16LF8\nOwner: Mahezabin Tai, President\nAddress: 253 Deep Brook Ct, Piscataway, NJ | Certifications: MBE, SBE, Asian-Pacific American Owned\nNAICS: 541613, 541611, 611420, 611430, 541714, 541715, 611519\nOPPORTUNITY:\n- Category: " + cat.label + " | NAICS: " + row.naics + " | Notice ID: " + (resolvedId||"See solicitation") + " | Agency: " + (agency||"Federal Agency") + "\n" + (pageCtx?"\n--- SAM.GOV PAGE ---\n"+pageCtx:"") + (attCtx?"\n--- ATTACHMENTS ---\n"+attCtx:"") + "\nWrite a compelling government proposal with sections: 1. EXECUTIVE SUMMARY 2. COMPANY OVERVIEW & CERTIFICATIONS 3. TECHNICAL APPROACH 4. PAST PERFORMANCE 5. KEY PERSONNEL 6. WHY UPVERSION LLC WINS 7. CALL TO ACTION. Formal government tone.";

    try {
      const res = await fetch("https://upversion-contracts.vercel.app/api/proposal", {
        method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({prompt}),
      });
      const data = await res.json();
      const full = (data.content && data.content.map(c=>c.text||"").join("\n")) || "Error generating proposal.";
      setProposal(full);
      try {
        const saveData = {proposal:full,noticeId:resolvedId,title,agency,naics:row.naics,savedAt:new Date().toISOString(),cat:cat.label};
        localStorage.setItem("upai_last_proposal", JSON.stringify(saveData));
        setSaved(true);
      } catch(e) {}
      setPhase("quality");
      await new Promise(r => setTimeout(r, 2000));
      const qp = 'Review this proposal, return ONLY valid JSON: {"score":<0-100>,"checks":[{"label":"Executive Summary","status":"pass|warn|fail","note":"brief"},{"label":"Certifications","status":"pass|warn|fail","note":"brief"},{"label":"Technical Approach","status":"pass|warn|fail","note":"brief"},{"label":"Past Performance","status":"pass|warn|fail","note":"brief"},{"label":"Key Personnel","status":"pass|warn|fail","note":"brief"},{"label":"Differentiators","status":"pass|warn|fail","note":"brief"},{"label":"Call to Action","status":"pass|warn|fail","note":"brief"},{"label":"Compliance Tone","status":"pass|warn|fail","note":"brief"}]}\nPROPOSAL:\n' + full.slice(0,3000);
      const qr = await fetch("https://upversion-contracts.vercel.app/api/proposal", {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt:qp})});
      const qd = await qr.json();
      const qt = (qd.content && qd.content.map(c=>c.text||"").join("")) || "{}";
      try {
        const parsed = JSON.parse(qt.replace(/```json|```/g,"").trim());
        setQualityScore(parsed.score);
        setQualityChecks(parsed.checks || []);
        const hChecks = [
          {label:"Past performance examples are accurate",checked:false},
          {label:"All requirements are addressed",checked:false},
          {label:"Pricing/cost is realistic",checked:false},
          {label:"Someone else has reviewed this",checked:false},
          {label:"Ready to submit",checked:false},
        ];
        setHumanChecks(hChecks);
        // Save everything to localStorage including quality
        try {
          const existing = JSON.parse(localStorage.getItem("upai_last_proposal") || "{}");
          existing.qualityScore = parsed.score;
          existing.qualityChecks = parsed.checks || [];
          existing.humanChecks = hChecks;
          localStorage.setItem("upai_last_proposal", JSON.stringify(existing));
        } catch(e2) {}
      } catch(e) { setQualityScore(75); setQualityChecks([]); }
      setPhase("done");
    } catch(e) { setProposal("Error: "+e.message); setPhase("done"); }
  }

  function toggleHumanCheck(i) { setHumanChecks(prev => prev.map((c,idx2) => idx2===i ? {...c,checked:!c.checked} : c)); }
  const humanDone = humanChecks.length > 0 && humanChecks.every(c=>c.checked);
  const statusIcon = s => s==="pass" ? "OK" : s==="warn" ? "!!" : "X";
  const scoreColor = qualityScore>=80?"#00c887":qualityScore>=60?"#f0c040":"#ff4d6d";
  const inp = {width:"100%",background:"#0a1628",border:"1px solid #1a3a5a",borderRadius:6,padding:"9px 12px",color:"#ddeeff",fontSize:14,outline:"none"};

  const phases = ["readingPage","reading","drafting","quality"];
  const phaseIcon = phase==="readingPage"?"[web]":phase==="reading"?"[doc]":phase==="drafting"?"[pen]":"[check]";
  const phaseMsg = phase==="readingPage"?pageMsg:phase==="reading"?readMsg:phase==="drafting"?draftMsg:qualMsg;

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.8)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
      <div style={{background:"#0d1b2a",border:"1px solid #1a3a5a",borderRadius:12,width:"100%",maxWidth:700,maxHeight:"92vh",display:"flex",flexDirection:"column",boxShadow:"0 8px 32px rgba(0,0,0,0.6)",animation:"slideUp 0.2s ease"}}>

        <div style={{background:"#0a1628",borderRadius:"12px 12px 0 0",padding:"14px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",borderBottom:"1px solid #1a3a5a"}}>
          <div>
            <div style={{color:"#00c887",fontSize:11,fontWeight:700,letterSpacing:2}}>UpAI PROPOSAL DRAFT</div>
            <div style={{color:"#ddeeff",fontSize:14,fontWeight:700,marginTop:2}}>{cat.icon} {cat.label} | NAICS {row.naics}</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"1px solid #1a3a5a",color:"#8aaabb",borderRadius:6,padding:"4px 12px",cursor:"pointer",fontSize:13}}>X Close</button>
        </div>

        {phase==="input" && (
          <div style={{overflowY:"auto",padding:"18px 20px"}}>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
              <div>
                <label style={{fontSize:12,fontWeight:700,color:"#8aaabb",display:"block",marginBottom:5,letterSpacing:1}}>NOTICE ID</label>
                <input value={noticeId} onChange={e=>setNoticeId(e.target.value)} placeholder="e.g. W9124X26QA014" style={{...inp,border:noticeId?"1px solid #00c887":"1px solid #1a3a5a"}}/>
                {noticeId && <div style={{color:"#00c887",fontSize:11,marginTop:4}}>Entered</div>}
              </div>
              <div>
                <label style={{fontSize:12,fontWeight:700,color:"#8aaabb",display:"block",marginBottom:5,letterSpacing:1}}>AGENCY (optional)</label>
                <input value={agency} onChange={e=>setAgency(e.target.value)} placeholder="e.g. Dept of Army, NIH" style={inp}/>
              </div>
            </div>
            <div style={{marginBottom:12}}>
              <label style={{fontSize:12,fontWeight:700,color:"#8aaabb",display:"block",marginBottom:5,letterSpacing:1}}>CONTRACT TITLE (optional)</label>
              <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Paste title from SAM.gov" style={inp}/>
            </div>
            <div style={{marginBottom:14}}>
              <label style={{fontSize:12,fontWeight:700,color:"#8aaabb",display:"block",marginBottom:5,letterSpacing:1}}>SAM.GOV URL (optional)</label>
              <input value={samUrl} onChange={e=>setSamUrl(e.target.value)} placeholder="https://sam.gov/opp/.../view" style={{...inp,border:samUrl?"1px solid #4fc3f7":"1px solid #1a3a5a"}}/>
              {samUrl && detectedId && <div style={{color:"#00c887",fontSize:11,marginTop:4}}>Notice ID detected: {detectedId}</div>}
              {samUrl && (
                <div onClick={()=>setReadPage(!readPage)} style={{display:"flex",alignItems:"center",gap:8,marginTop:8,cursor:"pointer",padding:"8px 12px",background:readPage?"#0a2a18":"#0a1628",border:"1px solid " + (readPage?"#00c88750":"#1a3a5a"),borderRadius:8}}>
                  <div style={{width:16,height:16,border:"2px solid " + (readPage?"#00c887":"#3a6a8a"),background:readPage?"#00c887":"transparent",borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                    {readPage && <span style={{color:"#001a10",fontSize:10,fontWeight:900}}>v</span>}
                  </div>
                  <div>
                    <div style={{color:readPage?"#00e5a0":"#8aaabb",fontSize:12,fontWeight:700}}>Let UpAI read the contract page first</div>
                    <div style={{color:"#4a6a8a",fontSize:11}}>UpAI scans SAM.gov page for all details before drafting</div>
                  </div>
                </div>
              )}
            </div>
            <div style={{borderTop:"1px solid #1a3a5a",paddingTop:14,marginBottom:14}}>
              {!showUpload ? (
                <div style={{background:"#0a2a18",border:"1px solid #00c88730",borderRadius:8,padding:"12px 16px"}}>
                  <div style={{color:"#00e5a0",fontSize:12,fontWeight:700,marginBottom:4}}>Want a more targeted proposal?</div>
                  <div style={{color:"#4a6a44",fontSize:12,marginBottom:10}}>Download attachments from SAM.gov and upload them. UpAI reads everything before drafting.</div>
                  <button onClick={()=>setShowUpload(true)} style={{background:"#0a1628",color:"#00c887",border:"1px solid #00c88740",borderRadius:6,padding:"6px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>Upload Attachments</button>
                </div>
              ) : (
                <div>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                    <label style={{fontSize:12,fontWeight:700,color:"#8aaabb",letterSpacing:1}}>UPLOAD ATTACHMENTS</label>
                    <button onClick={()=>setShowUpload(false)} style={{background:"none",border:"none",color:"#4fc3f7",fontSize:12,cursor:"pointer"}}>Skip</button>
                  </div>
                  <div onDragOver={e=>{e.preventDefault();setDragging(true);}} onDragLeave={()=>setDragging(false)} onDrop={handleDrop} onClick={()=>fileRef.current.click()}
                    style={{border:"2px dashed " + (dragging?"#00c887":"#1a3a5a"),borderRadius:8,padding:"18px",textAlign:"center",cursor:"pointer",background:dragging?"#0a2a18":"#060f1c"}}>
                    <div style={{fontSize:22,marginBottom:4}}>Folder</div>
                    <div style={{color:dragging?"#00e5a0":"#4a6a8a",fontSize:13}}>{dragging?"Drop files here!":"Drag & drop or click to browse"}</div>
                    <div style={{color:"#2a4a68",fontSize:11,marginTop:3}}>PDF, DOCX, TXT supported</div>
                    <input ref={fileRef} type="file" multiple accept=".pdf,.docx,.txt,.doc" onChange={handleFileInput} style={{display:"none"}}/>
                  </div>
                  {files.map((f,i)=>(
                    <div key={i} style={{display:"flex",justifyContent:"space-between",alignItems:"center",background:"#0a2a18",border:"1px solid #00c88730",borderRadius:6,padding:"6px 12px",marginTop:6}}>
                      <div style={{display:"flex",alignItems:"center",gap:8}}>
                        <span>Doc</span>
                        <div>
                          <div style={{color:"#00e5a0",fontSize:12,fontWeight:600}}>{f.name}</div>
                          <div style={{color:"#2a6a44",fontSize:10}}>{(f.size/1024).toFixed(1)} KB</div>
                        </div>
                      </div>
                      <button onClick={()=>removeFile(i)} style={{background:"none",border:"none",color:"#ff4d6d",cursor:"pointer",fontSize:16}}>X</button>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <button onClick={generate} disabled={!resolvedId&&!title&&!agency}
              style={{width:"100%",background:(resolvedId||title||agency)?"linear-gradient(135deg,#00c887,#0088cc)":"#0a2030",color:(resolvedId||title||agency)?"#001a10":"#2a5a78",border:"none",borderRadius:8,padding:"12px",fontWeight:800,fontSize:14,cursor:(resolvedId||title||agency)?"pointer":"not-allowed"}}>
              {files.length>0 ? "UpAI: Read " + files.length + " File(s) & Draft" : "UpAI: Generate Proposal"}
            </button>
          </div>
        )}

        {phases.includes(phase) && (
          <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:"40px 20px",gap:16}}>
            <div style={{width:60,height:60,borderRadius:"50%",background:"#1a3a5a",display:"flex",alignItems:"center",justifyContent:"center",fontSize:26,animation:"pulse 1.5s infinite"}}>{phaseIcon}</div>
            <div style={{color:"#ddeeff",fontSize:15,fontWeight:700,textAlign:"center"}}>{phaseMsg}</div>
            <div style={{display:"flex",gap:6}}>
              {[0,1,2].map(i=><div key={i} style={{width:8,height:8,borderRadius:"50%",background:"#00c887",animation:"pulse 1s " + (i*0.3) + "s infinite"}}/>)}
            </div>
          </div>
        )}

        {phase==="done" && (
          <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
            {qualityScore!==null && (
              <div style={{borderBottom:"1px solid #1a3a5a",background:"#0a1628",flexShrink:0}}>
                <div onClick={()=>setShowQuality(!showQuality)}
                  style={{padding:"8px 20px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer"}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{color:"#f0c040",fontSize:11,fontWeight:700,letterSpacing:2}}>UpAI QUALITY REPORT</span>
                    <span style={{color:scoreColor,fontSize:16,fontWeight:900}}>{qualityScore}%</span>
                    <span style={{background:scoreColor,color:"#001a10",fontSize:10,padding:"1px 8px",borderRadius:20,fontWeight:700}}>{qualityScore>=80?"Strong":qualityScore>=60?"Good":"Needs Work"}</span>
                  </div>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <span style={{color:"#00c887",fontSize:10,fontWeight:700}}>{humanChecks.filter(c=>c.checked).length}/{humanChecks.length} reviewed</span>
                    <span style={{color:"#4a6a8a",fontSize:12}}>{showQuality?"▲ Hide":"▼ Show"}</span>
                  </div>
                </div>
                {showQuality && (
                  <div style={{padding:"0 20px 12px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:10}}>
                      {qualityChecks.map((c,i)=>(
                        <div key={i} style={{display:"flex",gap:6,background:"#060f1c",border:"1px solid #1a3a5a",borderRadius:6,padding:"4px 8px"}}>
                          <span style={{fontSize:11}}>{statusIcon(c.status)}</span>
                          <div>
                            <div style={{color:"#ddeeff",fontSize:10,fontWeight:600}}>{c.label}</div>
                            <div style={{color:"#4a6a8a",fontSize:9}}>{c.note}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                    <div style={{color:"#8aaabb",fontSize:11,fontWeight:700,marginBottom:6}}>YOUR REVIEW CHECKLIST</div>
                    {humanChecks.map((c,i)=>(
                      <div key={i} onClick={()=>toggleHumanCheck(i)} style={{display:"flex",alignItems:"center",gap:8,padding:"5px 8px",cursor:"pointer",background:c.checked?"#0a2a18":"transparent",border:"1px solid "+(c.checked?"#00c88740":"#1a3a5a"),borderRadius:6,marginBottom:4}}>
                        <div style={{width:15,height:15,border:"2px solid "+(c.checked?"#00c887":"#3a6a8a"),background:c.checked?"#00c887":"transparent",borderRadius:3,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                          {c.checked && <span style={{color:"#001a10",fontSize:9,fontWeight:900}}>v</span>}
                        </div>
                        <span style={{color:c.checked?"#00e5a0":"#8aaabb",fontSize:12}}>{c.label}</span>
                      </div>
                    ))}
                    {humanDone && <div style={{marginTop:8,background:"#0a2a18",border:"1px solid #00c88750",borderRadius:8,padding:"8px",textAlign:"center",color:"#00e5a0",fontSize:13,fontWeight:700}}>Ready to submit!</div>}
                  </div>
                )}
              </div>
            )}
            <div style={{flex:1,overflowY:"auto",padding:"14px 20px"}}>
              <pre style={{color:"#b8d4ec",fontSize:13,lineHeight:1.8,whiteSpace:"pre-wrap",wordBreak:"break-word",fontFamily:"'Source Sans 3',sans-serif"}}>{proposal}</pre>
            </div>
          </div>
        )}

        {phase==="done" && (
          <div style={{padding:"10px 20px",borderTop:"1px solid #1a3a5a",flexShrink:0,background:"#0a1628"}}>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:6}}>
              <button onClick={()=>navigator.clipboard.writeText(proposal)} style={{background:"#0a2030",color:"#4fc3f7",border:"1px solid #1a4060",borderRadius:6,padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>📋 Copy</button>
              <button onClick={()=>downloadAsWord(proposal,resolvedId,title,agency,cat,row)} style={{background:"linear-gradient(135deg,#00c887,#009966)",color:"#001a10",border:"none",borderRadius:6,padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>📄 Download Word</button>
              <button onClick={()=>{setPhase("input");setProposal("");setQualityScore(null);setQualityChecks([]);setHumanChecks([]);}} style={{background:"#0a2030",color:"#6a8aa8",border:"1px solid #1a3a5a",borderRadius:6,padding:"7px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>↺ Redo</button>
              {saved && <span style={{color:"#00c887",fontSize:11,display:"flex",alignItems:"center"}}>💾 Saved</span>}
            </div>
            <button onClick={onClose} style={{width:"100%",background:humanDone?"#00c887":"linear-gradient(135deg,#1a6fb5,#0088cc)",color:humanDone?"#001a10":"#fff",border:"none",borderRadius:6,padding:"10px",fontWeight:800,fontSize:13,cursor:"pointer"}}>{humanDone?"✅ Submit Ready!":"Done"}</button>
          </div>
        )}
      </div>
    </div>
  );
}

function AgentsView() {
  var s1=React.useState("611519"),naicsFilter=s1[0],setNaicsFilter=s1[1];
  var s2=React.useState("pharmaceutical"),keyword=s2[0],setKeyword=s2[1];
  var s3=React.useState("idle"),phase=s3[0],setPhase=s3[1];
  var s4=React.useState(""),msg=s4[0],setMsg=s4[1];
  var s5=React.useState([]),results=s5[0],setResults=s5[1];
  var NAICS=[
    {code:"611519",sector:"61",label:"611519 - Pharma Technical Training",kw:"pharmaceutical"},
    {code:"541714",sector:"54",label:"541714 - R&D in Biotechnology",kw:"biotechnology"},
    {code:"541715",sector:"54",label:"541715 - Life Sciences",kw:"life sciences"},
    {code:"611420",sector:"61",label:"611420 - Computer Training",kw:"training"},
    {code:"541613",sector:"54",label:"541613 - Marketing Consulting",kw:"marketing services"},
    {code:"611430",sector:"61",label:"611430 - Management Training",kw:"management training"},
    {code:"541611",sector:"54",label:"541611 - Admin Consulting",kw:"management consulting"},
  ];
  var selN=NAICS.find(function(n){return n.code===naicsFilter;})||NAICS[0];
  var E=React.createElement;

  function scout(){
    setPhase("scouting");setResults([]);
    setMsg("Scout searching SAM.gov for "+selN.label+"...");
    fetch("https://upversion-contracts.vercel.app/api/sam?naics="+naicsFilter+"&keyword="+encodeURIComponent(keyword)+"&limit=10")
      .then(function(r){return r.json();})
      .then(function(d){
        var ops=[];

  React.useEffect(()=>{
    const s = localStorage.getItem("upai_last_proposal");
    if (s) { setShowRestoreBar(true); setSavedProposal(JSON.parse(s)); }
  },[]);

  function openSavedProposal() {
    const s = localStorage.getItem("upai_last_proposal");
    if (!s) return;
    const data = JSON.parse(s);
    // Find matching category and row
    let foundCat = CATEGORIES[0];
    let foundRow = CATEGORIES[0].naicsRows[0];
    for (const cat of CATEGORIES) {
      for (const row of cat.naicsRows) {
        if (row.naics === data.naics) { foundCat = cat; foundRow = row; break; }
      }
    }
    setDraftInfo({ row: foundRow, cat: foundCat, savedData: data });
  }

  const filtered = activeTab==="all" ? CATEGORIES : CATEGORIES.filter(c=>c.id===activeTab && c.id!=="agents" && c.id!=="pipeline");

  return (
    <div style={{minHeight:"100vh",background:"#0d1b2a"}}>
      <div style={{background:"#1b2a32",borderBottom:"3px solid #c0392b"}}>
        <div style={{maxWidth:1100,margin:"0 auto",padding:"10px 20px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:16}}>
            <img src={LOGO} alt="UPVERSION AI" style={{height:38,objectFit:"contain"}}/>
            <div style={{width:1,height:36,background:"#ffffff25"}}/>
            <div>
              <div style={{color:"#fff",fontSize:21,fontWeight:700,fontFamily:"'Merriweather',Georgia,serif"}}>UPVERSION LLC</div>
              <div style={{color:"#8aaabb",fontSize:12,letterSpacing:1.5,fontWeight:600}}>CONTRACT INTELLIGENCE - POWERED BY UpAI</div>
            </div>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end",maxWidth:160}}>
            {["MBE","SBE","NJ"].map(c=><span key={c} style={{background:"#ffffff18",color:"#fff",fontSize:9,padding:"2px 6px",borderRadius:20,fontWeight:700,border:"1px solid #ffffff30"}}>{c}</span>)}
            {showRestoreBar && <button onClick={openSavedProposal} style={{background:"#00c887",color:"#001a10",border:"none",borderRadius:4,padding:"3px 8px",fontWeight:700,fontSize:10,cursor:"pointer"}}>💾 Saved</button>}
          </div>
        </div>
      </div>



      <div style={{maxWidth:1100,margin:"0 auto",padding:"16px 20px"}}>
        <div style={{background:"#111f2e",border:"1px solid #1a3a5a",borderRadius:8,padding:"12px 20px",marginBottom:14,display:"flex",flexWrap:"wrap",gap:"10px 28px"}}>
          {[["UEI","Q1KPWH41NC57"],["CAGE","16LF8"],["President","Mahezabin Tai"],["Location","Piscataway, NJ"],["Certifications","MBE - SBE - Asian-Pacific"]].map(([k,v])=>(
            <div key={k}>
              <div style={{color:"#4a6a8a",fontSize:10,fontWeight:700,letterSpacing:1}}>{k}</div>
              <div style={{color:"#ddeeff",fontSize:13,fontWeight:600}}>{v}</div>
            </div>
          ))}
        </div>

        <div style={{display:"flex",gap:0,marginBottom:14,borderBottom:"2px solid #1a3a5a",flexWrap:"wrap"}}>
          {TABS.map(t=>(
            <button key={t.id} onClick={()=>setActiveTab(t.id)}
              style={{background:"none",border:"none",borderBottom:activeTab===t.id?"3px solid #00c887":"3px solid transparent",color:activeTab===t.id?"#00c887":"#4a6a8a",padding:"8px 16px",fontWeight:700,fontSize:13,cursor:"pointer",marginBottom:-2,whiteSpace:"nowrap"}}>
              {t.label}
            </button>
          ))}
        </div>

        {activeTab==="agents" ? React.createElement(AgentsView,null) : activeTab==="pipeline" ? React.createElement(AgentsPanel,null) : filtered.map(cat=><CategoryCard key={cat.id} cat={cat} onDraft={(row,c)=>setDraftInfo({row,cat:c})}/>)}

        <div style={{background:"#111f2e",border:"1px solid #1a3a5a",borderRadius:8,padding:"14px 20px",marginTop:8}}>
          <div style={{color:"#8aaabb",fontSize:11,fontWeight:700,letterSpacing:2,marginBottom:10}}>HOW UpAI WORKS</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(180px,1fr))",gap:10}}>
            {[["Contracts","Opens SAM.gov filtered to your NAICS + keyword, USA only"],["Draft","Enter Notice ID or URL, upload attachments, UpAI drafts your proposal"],["Quality Check","UpAI scores and flags issues. Complete human checklist."],["Auto-Save","Every proposal saved to browser automatically"],["Winners","See who won similar contracts - learn from competition"]].map(([t,d])=>(
              <div key={t} style={{display:"flex",gap:8,alignItems:"flex-start"}}>
                <div style={{width:26,height:26,borderRadius:6,background:"#0a2030",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,flexShrink:0,color:"#00c887",fontWeight:700}}>{t[0]}</div>
                <div>
                  <div style={{color:"#ddeeff",fontSize:12,fontWeight:700}}>{t}</div>
                  <div style={{color:"#4a6a8a",fontSize:11,lineHeight:1.5}}>{d}</div>
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <div style={{textAlign:"center",padding:"14px",color:"#2a4a68",fontSize:11,borderTop:"1px solid #1a3a5a",marginTop:16}}>
        UPVERSION LLC - UEI Q1KPWH41NC57 - Piscataway, NJ - Powered by UpAI + SAM.gov
      </div>

      {draftInfo && <ProposalModal row={draftInfo.row} cat={draftInfo.cat} savedData={draftInfo.savedData} onClose={()=>setDraftInfo(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
